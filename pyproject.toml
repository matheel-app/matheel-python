# Packaging for matheel-zatca, the official Python client for the Matheel ZATCA e-invoicing API.
[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "matheel-zatca"
version = "0.1.2"
description = "Official client for the Matheel ZATCA Phase 2 e-invoicing API (Saudi Arabia, Fatoora): file invoices with a device token, decode the QR, verify callbacks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Matheel", email = "hello@matheel.app" }]
keywords = ["zatca", "fatoora", "e-invoicing", "saudi", "vat", "einvoice"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://matheel.app/en/zatca-integration/python"
Documentation = "https://matheel.app/en/docs"
Source = "https://github.com/matheel-app/matheel-python"
Issues = "https://github.com/matheel-app/matheel-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/matheel_zatca"]

[tool.hatch.build.targets.sdist]
include = ["src/matheel_zatca", "tests", "README.md", "LICENSE", "CHANGELOG.md"]
